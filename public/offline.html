<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline — Football AI Analyst</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }
    .icon { font-size: 4rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 0.75rem; }
    p { color: #64748b; font-size: 0.9rem; line-height: 1.6; max-width: 320px; margin-bottom: 2rem; }
    a {
      display: inline-block;
      background: #10b981;
      color: #020617;
      font-weight: 700;
      font-size: 0.875rem;
      padding: 0.75rem 1.5rem;
      border-radius: 0.75rem;
      text-decoration: none;
      min-height: 44px;
      line-height: 1;
      display: flex;
      align-items: center;
    }
    a:hover { background: #34d399; }
  </style>
</head>
<body>
  <div class="icon">⚽</div>
  <h1>You're offline</h1>
  <p>No internet connection. Previously viewed match reports are still available — try going back.</p>
  <a href="/">Go to home</a>
</body>
</html>
